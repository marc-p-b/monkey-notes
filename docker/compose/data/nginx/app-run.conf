# No server_name: this is the only server block, so it is nginx's default
# server and matches any Host. Traefik already routed by Host before us.
server {
    listen 80;
    server_tokens off;
    client_max_body_size 500M;

    root /var/www/ui/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
