#version: '3'
# Alternate stack: serves the UI straight from ui/ source via the Vite dev server
# (npm-docker/Dockerfile) instead of the nginx+dist build. /api still goes through
# Traefik straight to mn-api, same as docker-compose.yml.
#
# Usage (from docker/compose/):
#   UID=$(id -u) GID=$(id -g) docker compose -f docker-compose.vite.yml up

networks:
    mn_int:
        internal: true
    mn_ext:
services:
  traefik:
    image: traefik:v3.7.8
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./data/traefik/certs:/etc/traefik/certs:ro
    networks:
      - mn_ext
  vite-ui:
    image: monkeynotes/mn-vite:latest
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mn_ext"
      - "traefik.http.routers.mn-ui.rule=Host(`notes.monkeynotes.fr`)"
      - "traefik.http.routers.mn-ui.entrypoints=websecure"
      - "traefik.http.routers.mn-ui.tls=true"
      - "traefik.http.services.mn-ui.loadbalancer.server.port=5173"
    networks:
      - mn_int
      - mn_ext

  db:
    image: postgres:18.1
    restart: on-failure
    environment:
      POSTGRES_DB: monkey_db
      POSTGRES_USER: monkey_user
      POSTGRES_PASSWORD: monK3Y__42_Pa55w0rD
    volumes:
      - ./data/postgres:/var/lib/postgresql/data/pg14
    hostname: mn-db
    networks:
      - mn_int
  mn-api:
    depends_on:
      - db
    image: monkeynotes/mn-api:latest
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - YOUR_DOMAIN=${YOUR_DOMAIN}
      - YOUR_DOMAIN_API=${YOUR_DOMAIN_API}
      - CORS_DOMAINS=${CORS_DOMAINS}
      - GDRIVE_CLIENT_ID=${GDRIVE_CLIENT_ID}
      - GDRIVE_SECRET=${GDRIVE_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QWEN_API_KEY=${QWEN_API_KEY}
      - EMAIL_ENABLE=${EMAIL_ENABLE}
      - EMAIL_SENDER=${EMAIL_SENDER}
      - MAILJET_PUBLIC=${MAILJET_PUBLIC}
      - MAILJET_PRIVATE=${MAILJET_PRIVATE}
    volumes:
      - ./data/mn_data/:/mn_data
      - ./data/logs/:/logs
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mn_ext"
      - "traefik.http.routers.mn-api.rule=Host(`notes.monkeynotes.fr`) && PathPrefix(`/api`)"
      - "traefik.http.routers.mn-api.entrypoints=websecure"
      - "traefik.http.routers.mn-api.tls=true"
      - "traefik.http.routers.mn-api.middlewares=mn-api-stripprefix"
      - "traefik.http.middlewares.mn-api-stripprefix.stripprefix.prefixes=/api"
      - "traefik.http.services.mn-api.loadbalancer.server.port=8080"
    networks:
      - mn_int
      - mn_ext