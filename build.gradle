plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'fr.monkeynotes'
version = '0.0.1-SNAPSHOT'
description = 'Monkey Notes OCR and transcript exploration'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot starters (versions managed by the BOM, like the maven parent)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    runtimeOnly 'org.postgresql:postgresql'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // JSON / diff
    implementation 'com.jayway.jsonpath:json-path:2.9.0'
    implementation 'org.json:json:20240303'
    implementation 'io.github.java-diff-utils:java-diff-utils:4.16'

    // Lucene full-text search
    implementation 'org.apache.lucene:lucene-core:10.3.1'
    implementation 'org.apache.lucene:lucene-queryparser:10.3.1'
    implementation 'org.apache.lucene:lucene-highlighter:10.3.1'

    // Google Drive sync
    implementation 'com.google.api-client:google-api-client:2.0.0'
    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.34.1'
    implementation 'com.google.apis:google-api-services-drive:v3-rev20220815-2.0.0'

    // Mail notifications
    implementation 'com.mailjet:mailjet-client:5.2.0'

    // PDF / image processing
    implementation 'org.apache.pdfbox:pdfbox:3.0.1'
    implementation 'org.openpnp:opencv:4.8.1-0'

    // Note: legacy coordinate kept as-is from pom.xml (org.apache.commons, not commons-io)
    implementation 'org.apache.commons:commons-io:1.3.2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.register('dockerJar', Copy) {
    dependsOn bootJar
    from bootJar.archiveFile
    into layout.projectDirectory.dir('docker/api-build')
    rename { 'app.jar' }
}

tasks.named('test') {
    useJUnitPlatform()
}
