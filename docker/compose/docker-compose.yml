#version: '3'

networks:
  net_int:
    # Explicit name: without it the real network is <project>_net_int, and the
    # project defaults to this directory's name. The traefik.docker.network
    # labels below must match exactly, or traefik silently picks an arbitrary
    # network for multi-homed containers and dials an unreachable address.
    name: monkeynotes_net_int
    internal: true
  net_ext:
    name: monkeynotes_net_ext
services:
  traefik:
    image: traefik:v3.7.8
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./data/traefik/certs:/etc/traefik/certs:ro
    networks:
      - net_ext
  nginx:
    image: monkeynotes/ui:latest
    restart: unless-stopped
    volumes:
      - ./data/nginx:/etc/nginx/conf.d
      - ./data/nginx/env.js:/var/www/ui/dist/env.js:ro
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ui.rule=Host(`${HOST}`)"
      - "traefik.http.routers.ui.entrypoints=websecure"
      - "traefik.http.routers.ui.tls=true"
      - "traefik.http.services.ui.loadbalancer.server.port=80"
    networks:
      - net_ext
  db:
    image: postgres:18.1
    restart: on-failure
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    hostname: db
    networks:
      - net_int
  adminer:
    image: adminer:latest
    restart: on-failure
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=monkeynotes_net_ext"
      - "traefik.http.routers.adminer.rule=Host(`${HOST}`) && PathPrefix(`/adminer`)"
      - "traefik.http.routers.adminer.entrypoints=websecure"
      - "traefik.http.routers.adminer.tls=true"
      - "traefik.http.routers.adminer.middlewares=adminer-redirect-slash,adminer-stripprefix"
      - "traefik.http.middlewares.adminer-redirect-slash.redirectregex.regex=^https://([^/]+)/adminer$$"
      - "traefik.http.middlewares.adminer-redirect-slash.redirectregex.replacement=https://$${1}/adminer/"
      - "traefik.http.middlewares.adminer-redirect-slash.redirectregex.permanent=true"
      - "traefik.http.middlewares.adminer-stripprefix.stripprefix.prefixes=/adminer"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"
    networks:
      - net_int
      - net_ext
  api:
    depends_on:
      - db
    image: monkeynotes/api:latest
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - HOST=${HOST}
      - API_PATH=${API_PATH}
      - DOMAIN=${DOMAIN}
      - DOMAIN_API=${DOMAIN_API}
      - CORS_DOMAINS=${CORS_DOMAINS}
      - DB_URL=${DB_URL}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - EMAIL_ENABLE=${EMAIL_ENABLE}
      - EMAIL_SENDER=${EMAIL_SENDER}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QWEN_API_KEY=${QWEN_API_KEY}
      - MAILJET_PUBLIC=${MAILJET_PUBLIC}
      - MAILJET_PRIVATE=${MAILJET_PRIVATE}
      - JWT_SECRET=${JWT_SECRET}
      - GDRIVE_CLIENT_ID=${GDRIVE_CLIENT_ID}
      - GDRIVE_SECRET=${GDRIVE_SECRET}
      - SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT=120000
    volumes:
      - ./data/data/:/data
      - ./data/logs/:/logs
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=monkeynotes_net_ext"
      - "traefik.http.routers.api.rule=Host(`${HOST}`) && PathPrefix(`${API_PATH}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.middlewares=api-stripprefix"
      - "traefik.http.middlewares.api-stripprefix.stripprefix.prefixes=${API_PATH}"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
    networks:
      - net_int
      - net_ext